# .github/workflows/build.yml
name: Simple Docker Build and Push
run-name: Deploy by @${{ github.actor }}

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.VPS_GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build Docker image    
      # run: docker build -t ghcr.io/${{ github.repository }}:latest -f core/Dockerfile . 
      # run: docker build -t ghcr.io/${{ github.repository }}/core1:latest .
        run: docker build -t ghcr.io/${{ github.repository }}:latest .
      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository }}:latest

#      - name: Deploy to VPS
#        uses: appleboy/ssh-action@master
#        with:
#          host: ${{ secrets.SSH_HOST }}
#          username: ${{ secrets.SSH_USER }}
#          key: ${{ secrets.SSH_PRIVATE_KEY }}
#          script: |
#            echo "${{ secrets.VPS_GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
#            docker pull ghcr.io/${{ github.repository }}:latest
#            cd /home/cerdo/django
#            docker compose down && docker compose up -d
#            docker logout ghcr.io
            
            

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "${{ secrets.VPS_GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd /home/cerdo/django
            docker compose pull django
            docker compose up -d --force-recreate
            docker compose exec -T django python manage.py migrate --noinput
            docker image prune -f
            docker logout ghcr.io

      - name: Logout from GitHub Container Registry
        if: always()
        run: docker logout ghcr.io

